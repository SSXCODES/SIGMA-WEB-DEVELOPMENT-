<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms - Lets learn it </title>
</head>
<body>
    <h1> Form to apply for the role of my GF - Sudhanshu</h1>
    <form action="post">
        <div>
            <label for="username"> Eneter Your Username : </label>
            <input type="text" id="username " name="username" placeholder ="enter your username">
        </div>
        <div>
            <input type="radio" id="male" name="gender" value="male"
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female"></input>
            <label for="female">Female</label>
        </div>

        <div>
            <input type="checkbox" id="loyal" value="loyal" value="yes">
            <label for="loyal">Click for Loyality</label>
        </div>
    </form>
</body>
</html>
