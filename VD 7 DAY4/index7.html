<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms - Lets learn it </title>
</head>
<body>
    <h1> Form to apply for the role of my GF - Sudhanshu</h1>
    <form action="post">
        <div>
            <label for="username"> Eneter Your Username : </label>
            <input type="text" id="username " name="username" placeholder ="enter your username" autofocus required>
        </div>
        <div>
            <input type="radio" id="male" name="gender" value="male"
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female"></input>
            <label for="female">Female</label>
        </div>

        <div>
            <input type="checkbox" id="loyal" name="loyal" value="yes">
            <label for="loyal">Click for Loyality</label>
        </div>
        <div>
            <label for="comment">Brief About Youself...</label>
            <br>
            <textarea id="comment" name="Comment" rows="5" cols="40">Brieef about Youself......</textarea>  
        </div>
        <div>
            <label for="Job">Job Profile</label>
            <select id="job" name="Job">
                <option value="Engenier">Engenier</option>
                <option value="Doctor">Doctor</option>
                <option value="Artist">Artist</option>
                <option value="Defence">Defence</option>
            </select>
        </div>
    </form>
</body>
</html>
